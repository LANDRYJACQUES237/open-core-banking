spring:
  application:
    name: payment-service

  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${PAYMENT_DB_USER:payment_app}
    password: ${PAYMENT_DB_PASSWORD:}
    hikari:
      pool-name: payment-pool
      maximum-pool-size: ${PAYMENT_DB_POOL_SIZE:10}

  flyway:
    enabled: true
    schemas: payment
    default-schema: payment
    # Utilisateur de migration distinct de l'utilisateur d'execution : les confondre
    # donnerait a l'application le pouvoir de retirer ses propres garde-fous.
    user: ${PAYMENT_DB_MIGRATION_USER:postgres}
    password: ${PAYMENT_DB_MIGRATION_PASSWORD:}
    placeholders:
      paymentAppRole: ${PAYMENT_APP_ROLE:payment_app}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all et idempotence activee : sans cela, une reelection de leader peut
      # faire perdre un message deja accuse, ou le dupliquer sur retentative interne.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      # Validation manuelle des offsets par le conteneur, apres retour du listener :
      # un offset valide avant traitement transformerait un redemarrage en perte de message.
      enable-auto-commit: false
    listener:
      ack-mode: record

  jackson:
    default-property-inclusion: non_null

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8090/realms/ocb}
      client:
        registration:
          ledger:
            # Ce service s'authentifie en tant que lui-meme, pas au nom de l'appelant.
            # L'ecriture comptable est sa decision, prise apres validation ; propager le
            # jeton du marchand reviendrait a lui accorder indirectement ledger:post.
            provider: ocb
            client-id: ${LEDGER_CLIENT_ID:payment-service}
            client-secret: ${LEDGER_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: ledger:post,ledger:read
        provider:
          ocb:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8090/realms/ocb/protocol/openid-connect/token}

server:
  port: ${PAYMENT_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never

ocb:
  security:
    audiences:
      - payment-service

  kafka:
    consumer:
      # Schema hebergeant processed_message. Le module partage ne cree pas la table :
      # chaque service possede son schema.
      schema: payment
    groups:
      # Externalises plutot que figes dans les annotations : un groupe en dur empeche de
      # faire tourner deux instances logiques du service, et interdit d'isoler proprement
      # des suites de tests qui partagent un meme courtier.
      provider-events: payment-service.provider-events

  ledger:
    base-url: ${LEDGER_BASE_URL:http://localhost:8081}
    connect-timeout: PT2S
    # Court volontairement : au-dela, mieux vaut laisser le message etre redelivre que
    # de tenir une transaction et un verrou de ligne ouverts.
    read-timeout: PT10S

  outbox:
    schema: payment
    batch-size: 100
    poll-interval: PT1S
    send-timeout: PT10S
    retention: P7D

  fees:
    collection:
      # 1 % des encaissements, retenu sur le montant recu.
      basis-points: 100
      fixed: 0
    disbursement:
      # 1 % des decaissements, preleve en plus du montant envoye.
      basis-points: 100
      fixed: 0
    transfer:
      # 1 % des transferts, a la charge de l'emetteur.
      basis-points: 100
      fixed: 0

  # Aucune configuration d'operateur ici : depuis la Phase 3, provider-service consomme
  # ocb.cmd.provider.v1 et publie ocb.evt.provider.v1. Ce service ne connait des
  # operateurs que leur code, transporte dans les evenements.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    com.ocb: ${PAYMENT_LOG_LEVEL:INFO}
