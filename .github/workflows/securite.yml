name: securite

# Deux analyses que la suite de tests ne fait pas.
#
# Les tests verifient que le systeme se comporte comme prevu ; ils ne disent rien d'une
# bibliotheque vulnerable, d'un usage douteux d'une primitive cryptographique, ni d'un
# conteneur qui tournerait en root. C'est le travail de cette analyse — qui a d'ailleurs
# trouve, des sa mise en place, que l'image de migration s'executait en root.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Une vulnerabilite est publiee apres la fusion du code qu'elle touche. Sans execution
    # periodique, l'analyse ne dirait que ce qui etait connu le jour de la derniere
    # poussee.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  codeql:
    name: Analyse statique du code Java
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # GitHub n'accorde qu'un jeton en lecture seule aux executions declenchees par
    # Dependabot. CodeQL ne peut donc pas televerser ses resultats, et le travail echoue
    # pour une raison qui n'a rien a voir avec la securite du code.
    #
    # Ces demandes de fusion ne changent que des numeros de version. L'analyse tourne de
    # toute facon sur master apres fusion, et chaque semaine.
    #
    # Le travail suivant, lui, continue de s'executer : il n'ecrit rien et n'a besoin
    # d'aucun droit particulier.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # security-extended ajoute les regles a taux de faux positifs plus eleve. Sur un
          # systeme qui manipule de l'argent, un faux positif coute moins cher qu'un
          # angle mort.
          queries: security-extended

      # Compilation explicite plutot qu'autobuild : le reacteur a plusieurs modules et des
      # sources generees depuis les contrats OpenAPI, qu'un autobuild peut manquer sans le
      # dire — l'analyse serait alors verte sur du code qu'elle n'a pas vu.
      - name: Compiler
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Analyser
        uses: github/codeql-action/analyze@v3

  configuration:
    name: Configuration des conteneurs et manifestes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # Dockerfiles, chart Helm et manifestes Kubernetes. L'analyse echoue sur HIGH et
      # CRITICAL plutot que de se contenter de rapporter : un rapport que personne ne lit
      # ne protege de rien.
      - name: Analyser la configuration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Les constats acceptes, chacun avec sa raison ecrite. Ce fichier ne baisse pas
          # le seuil : il documente ce qui a ete examine puis assume.
          trivyignores: .trivyignore.yaml
