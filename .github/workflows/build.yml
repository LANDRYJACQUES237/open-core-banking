name: build

# Le developpement local se fait sur JDK 25 avec maven.compiler.release=21.
# La CI, elle, compile ET execute sur JDK 21 : c'est la cible de production.
# Tout ecart de comportement entre les deux doit se reveler ici, dans un pipeline
# qui tourne a chaque push, plutot que tardivement sur un environnement reel.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: JDK 21 - build, tests unitaires et integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Garde-fou de l'exigence "aucun secret dans le depot". Deterministe et sans
      # dependance externe : il echoue si un fichier de secrets a ete versionne par
      # accident, quel que soit son contenu. Un scanner d'entropie type gitleaks
      # viendra en complement quand le depot sera public.
      - name: Verifier qu'aucun secret n'est versionne
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|dev|prod|production)$|\.pem$|\.key$|\.p12$|\.jks$|(^|/)id_rsa' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Fichiers sensibles versionnes :"
            echo "$tracked"
            exit 1
          fi
          echo "Aucun fichier sensible versionne."

      - name: Verifier que le wrapper Maven est executable
        run: chmod +x ./mvnw

      # `verify` execute les deux suites : surefire (unitaires, sans Docker) puis
      # failsafe (integration, Testcontainers). Docker est preinstalle sur les
      # runners ubuntu-latest, donc les tests d'integration tournent reellement —
      # y compris la contrainte differee et les droits PostgreSQL, qui n'ont aucun
      # sens sans un vrai serveur.
      - name: Build et tests
        run: ./mvnw -B -ntp verify

      - name: Publier les rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-de-test-jdk21
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 14
          if-no-files-found: ignore

  # Le deploiement se verifie comme le reste.
  #
  # Un chart Helm n'a pas de compilateur : une clef en double, un gabarit jamais rendu, un
  # garde-fou qui ne se declenche plus se decouvrent au deploiement si personne ne les
  # exerce. Ce travail est independant du precedent et tourne en parallele.
  deploiement:
    name: Manifestes de deploiement
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Installer kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz             | sudo tar xz -C /usr/local/bin kubeconform

      - name: Le fichier Compose est interpretable
        run: docker compose -f deploy/docker/docker-compose.yml config --quiet

      - name: Le chart passe le lint
        run: helm lint deploy/helm/open-core-banking

      # helm lint valide la syntaxe des gabarits, pas le YAML produit : c'est kubeconform
      # qui a trouve la clef app.kubernetes.io/component en double dans les Job.
      - name: Les manifestes rendus sont valides pour l'API Kubernetes
        run: |
          helm template ocb deploy/helm/open-core-banking             | kubeconform -strict -summary -kubernetes-version 1.30.0

      # Les gabarits desactives par defaut ne sont jamais rendus, donc jamais verifies.
      # Cette seconde generation les exerce : ingress actif, un service retire.
      - name: Les gabarits optionnels sont valides eux aussi
        run: |
          helm template ocb deploy/helm/open-core-banking             --set services.provider.ingress.enabled=true             --set services.notification.enabled=false             --set image.tag=1.2.3             | kubeconform -strict -summary -kubernetes-version 1.30.0

      # Contre-epreuve. Le chart refuse que le Secret des pods et celui du Job de
      # migration soient le meme : sans cela, l'application detiendrait le mot de passe du
      # proprietaire du schema et pourrait retirer l'immuabilite du grand livre. Un
      # garde-fou qu'on ne tente jamais de declencher n'est qu'un commentaire.
      - name: Le garde-fou sur la separation des Secret se declenche
        run: |
          if helm template ocb deploy/helm/open-core-banking                --set services.ledger.migration.secretName=ocb-ledger-app >/dev/null 2>&1; then
            echo "::error::Le chart a accepte un Secret partage entre le Job de migration et les pods."
            exit 1
          fi
          echo "Le garde-fou a bien refuse la configuration."
