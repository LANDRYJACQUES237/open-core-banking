# Une dependance vulnerable ne se signale pas toute seule.
#
# Le regroupement des mises a jour mineures et correctives evite de noyer le depot sous
# des demandes de fusion : ce qui doit se voir, ce sont les montees de version majeures et
# les correctifs de securite, pas un incrementiel de patch par bibliotheque.

version: 2
updates:

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mineures-et-correctives:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"

  # Une action epinglee sur une etiquette mobile est une dependance dont le contenu peut
  # changer sans que rien ne le signale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(ci)"

  # Les images de base : JRE, Maven, Flyway. Une vulnerabilite du systeme de base ne se
  # voit pas dans le code applicatif.
  - package-ecosystem: docker
    directories:
      - /deploy/docker
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(images)"
    # Les montees de version MAJEURE sont ignorees, parce qu'elles contredisent des
    # decisions ecrites ailleurs dans le depot :
    #
    #   - le JDK 21 est la cible declaree du projet, et l'integration continue compile ET
    #     execute dessus. Passer l'image d'execution en 25 ferait diverger l'image de ce
    #     que les tests ont valide.
    #   - la version majeure de Flyway est alignee sur celle qu'embarque Spring Boot, et
    #     Dockerfile.migrate dit que cet alignement se verifie a la main.
    #
    # Les correctifs de securite d'une meme majeure continuent d'arriver, et ce sont eux
    # qui comptent. Une montee de majeure reste possible : elle se decide, elle ne se subit
    # pas.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]
      - dependency-name: flyway/flyway
        update-types: ["version-update:semver-major"]
