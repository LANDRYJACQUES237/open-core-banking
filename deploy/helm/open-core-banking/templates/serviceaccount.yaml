{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-platform
  # Redondant pour `helm install`, indispensable pour un manifeste rendu :
  # `helm template` n'inscrit pas le namespace, et un YAML sans namespace
  # applique depuis une interface graphique atterrit dans `default`.
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ocb.labels" (dict "root" . "name" "platform") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Aucun de ces services n'appelle l'API Kubernetes. Monter le jeton du compte de service
# dans chaque pod ne servirait qu'a offrir des identifiants de cluster a qui prendrait la
# main sur un conteneur.
automountServiceAccountToken: false
{{- end }}
