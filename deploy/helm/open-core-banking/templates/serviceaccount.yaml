{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    {{- include "ocb.labels" (dict "root" . "name" "platform") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Aucun de ces services n'appelle l'API Kubernetes. Monter le jeton du compte de service
# dans chaque pod ne servirait qu'a offrir des identifiants de cluster a qui prendrait la
# main sur un conteneur.
automountServiceAccountToken: false
{{- end }}
