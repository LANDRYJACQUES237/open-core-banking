{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ocb.name" $ctx }}
  # Redondant pour `helm install`, indispensable pour un manifeste rendu :
  # `helm template` n'inscrit pas le namespace, et un YAML sans namespace
  # applique depuis une interface graphique atterrit dans `default`.
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ocb.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
  selector:
    {{- include "ocb.selectorLabels" $ctx | nindent 4 }}
{{- end }}
{{- end }}
