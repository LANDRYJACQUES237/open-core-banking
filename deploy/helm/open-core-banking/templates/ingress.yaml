{{/*
Un seul service a une raison d'etre joignable de l'exterieur : provider-service, que les
operateurs Mobile Money rappellent. Les trois autres restent en ClusterIP.

L'adresse publiee ici doit correspondre a PROVIDER_CALLBACK_BASE_URL : c'est celle que le
service communique aux operateurs quand il emet un ordre.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.ingress $svc.ingress.enabled }}
{{- $ctx := dict "root" $ "name" $name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ocb.name" $ctx }}
  labels:
    {{- include "ocb.labels" $ctx | nindent 4 }}
  {{- with $svc.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $svc.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $svc.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $svc.ingress.host | quote }}
      http:
        paths:
          - path: {{ $svc.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "ocb.name" $ctx }}
                port:
                  name: http
{{- end }}
{{- end }}
