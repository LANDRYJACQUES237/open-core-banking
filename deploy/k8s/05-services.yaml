# Source: open-core-banking/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocb-ledger
  # Redondant pour `helm install`, indispensable pour un manifeste rendu :
  # `helm template` n'inscrit pas le namespace, et un YAML sans namespace
  # applique depuis une interface graphique atterrit dans `default`.
  namespace: ocb
  labels:
    helm.sh/chart: open-core-banking-0.1.0
    app.kubernetes.io/name: open-core-banking
    app.kubernetes.io/instance: ocb
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: open-core-banking
    app.kubernetes.io/component: ledger
spec:
  
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Aucune indisponibilite pendant la bascule : le nouveau pod doit etre pret avant
      # que l'ancien ne parte.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-core-banking
      app.kubernetes.io/instance: ocb
      app.kubernetes.io/component: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-core-banking
        app.kubernetes.io/instance: ocb
        app.kubernetes.io/component: ledger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ledger
          image: ghcr.io/landryjacques237/ledger-service:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: OIDC_ISSUER_URI
              value: "http://ocb-keycloak:8080/realms/ocb"
            
            - name: OIDC_JWK_SET_URI
              value: "http://ocb-keycloak:8080/realms/ocb/protocol/openid-connect/certs"
            
            - name: LEDGER_APP_ROLE
              value: "ledger_app"
            - name: LEDGER_DB_POOL_SIZE
              value: "5"
            - name: LEDGER_DB_URL
              value: "jdbc:postgresql://ocb-postgres:5432/ledger"
            - name: LEDGER_DB_USER
              value: "ledger_app"
            - name: LEDGER_LOG_LEVEL
              value: "INFO"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
          
          envFrom:
            - secretRef:
                name: ocb-ledger-app
          
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # La racine est en lecture seule ; Tomcat et la JVM ont besoin d'un repertoire
        # temporaire inscriptible, et lui seul.
        - name: tmp
          emptyDir: {}
