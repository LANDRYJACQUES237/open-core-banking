      ],
      "defaultDefaultClientScopes": [],
      "clients": [
        {
          "clientId": "payment-service",
          "description": "Compte de service du moteur de paiement. Seul detenteur de ledger:post ; porte aussi ledger:read, l'interdiction de decouvert exigeant de lire le solde avant d'engager les fonds.",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${OCB_CLIENT_SECRET_PAYMENT}",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "defaultClientScopes": [
            "ledger:post",
            "ledger:read"
