---
apiVersion: v1
kind: Service
metadata:
  name: ocb-keycloak
  namespace: test
  labels:
    app.kubernetes.io/name: ocb-keycloak
    app.kubernetes.io/part-of: open-core-banking
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: ocb-keycloak

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocb-keycloak
  namespace: test
  labels:
    app.kubernetes.io/name: ocb-keycloak
    app.kubernetes.io/part-of: open-core-banking
spec:
  replicas: 1
  # Recreate plutot que RollingUpdate : deux instances Keycloak qui migrent le meme schema
  # au demarrage se marcheraient dessus.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ocb-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocb-keycloak
        app.kubernetes.io/part-of: open-core-banking
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          imagePullPolicy: IfNotPresent
          args: ["start", "--import-realm"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://ocb-postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            # TLS absent devant Keycloak : le trafic reste dans le cluster, et aucun
            # Ingress ne pointe ici. Exposer ce service demanderait de reprendre ce point.
            - name: KC_HTTP_ENABLED
              value: "true"
            # Sans nom d'hote fige, Keycloak deduit l'emetteur de l'adresse appelee : un
            # jeton demande depuis un pod porterait un `iss` different de celui demande
            # ailleurs, et la validation echouerait selon le chemin emprunte.
            - name: KC_HOSTNAME
              value: http://ocb-keycloak:8080
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
          # Mot de passe d'administration, mot de passe de base, et les trois secrets
          # clients que le realm resout a l'import.
          envFrom:
            - secretRef:
                name: ocb-keycloak
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          # Les sondes visent le port de gestion, separe du port applicatif depuis
          # Keycloak 25 : /health/ready n'est pas joignable sur 8080.
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: realm
          configMap:
            name: ocb-keycloak-realm
