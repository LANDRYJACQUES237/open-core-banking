# =====================================================================================
# Keycloak, en mode production, avec un realm sans aucun secret.
#
# Deux differences avec la pile Docker Compose, et ce sont des durcissements.
#
# **`start` et non `start-dev`.** Le mode developpement desactive des verifications et
# n'est destine a rien d'autre qu'un poste. Le mode production exige une base de donnees
# externe : c'est PostgreSQL, base `keycloak`, role dedie.
#
# **Le realm ne contient aucun secret.** Les valeurs sont des references
# `${VARIABLE}` que Keycloak resout a l'import depuis l'environnement, lui-meme
# alimente par un Secret. Le realm de developpement, lui, porte des secrets `dev-only-*`
# en clair et versionnes : ils ne protegent rien et ne doivent jamais servir ici.
#
# Verifie avant d'etre ecrit : un jeton demande avec la valeur de l'environnement est
# accepte, le meme demande avec le litteral non substitue est refuse.
#
# ------------------------------------------------------------------------------------
# **La console d'administration n'est pas exposee.** Le Service est un ClusterIP et aucun
# Ingress ne pointe dessus. Y acceder demande un port-forward, donc un droit sur le
# cluster — pas un mot de passe devine.
# ------------------------------------------------------------------------------------
# =====================================================================================

# -------------------------------------------------------------------------------------
# **Le namespace est inscrit dans ce fichier, et doit correspondre a la cible.**
#
#     sed -i 's/^  namespace: ocb$/  namespace: VOTRE-NAMESPACE/' deploy/k8s/*.yaml
# -------------------------------------------------------------------------------------

apiVersion: v1
kind: ConfigMap
metadata:
  name: ocb-keycloak-realm
  namespace: test
  labels:
    app.kubernetes.io/name: ocb-keycloak
    app.kubernetes.io/part-of: open-core-banking
