# =====================================================================================
# Pod de verification, temporaire.
#
# Les images applicatives ne contiennent ni curl ni shell utilitaire, et leur racine est en
# lecture seule : c'est voulu, et cela empeche de verifier depuis elles. Ce pod fournit de
# quoi interroger la plateforme depuis l'interieur du cluster, ou les Service sont
# joignables — aucun d'eux n'etant expose a l'exterieur.
#
# ------------------------------------------------------------------------------------
# **Un pod ne se met pas a jour : il se remplace.** Corriger ce manifeste puis le
# reappliquer ne change rien au pod en cours ; il faut le supprimer d'abord.
#
# Et supprimer peut echouer sur un droit auquel on ne pense pas : une interface graphique
# passe souvent par l'API d'eviction, qui est une permission distincte de la suppression.
#
#     pods "ocb-verification" is forbidden: User "..." cannot create resource
#     "pods/eviction" in API group "" in the namespace "test"
#
# Quand ce droit manque, changer le `name` ci-dessous suffit : le nouveau pod demarre, et
# l'ancien s'eteint de lui-meme grace a activeDeadlineSeconds.
# ------------------------------------------------------------------------------------
#
# **A supprimer une fois la verification faite.**
#
# Il ne detient aucun droit Kubernetes, mais il sait joindre toutes les bases et tous les
# services du namespace. C'est un outil de diagnostic, pas un resident.
# ------------------------------------------------------------------------------------
#
# Le script a executer dedans est dans deploy/k8s/verifier-le-cluster.sh. Il reprend les
# etapes de deploy/parcours.sh qui ne demandent pas Docker Compose.
# =====================================================================================

apiVersion: v1
kind: Pod
metadata:
  name: ocb-verification
  namespace: test
  labels:
    app.kubernetes.io/name: ocb-verification
    app.kubernetes.io/part-of: open-core-banking
spec:
  automountServiceAccountToken: false
  # Le pod s'eteint tout seul apres une heure : un outil de diagnostic oublie est le genre
  # de chose qui reste.
  activeDeadlineSeconds: 3600
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
  containers:
    - name: shell
      # netshoot embarque curl, jq et de quoi diagnostiquer le reseau. Version epinglee :
      # un outil de diagnostic qui change entre deux sessions produit des surprises.
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
      # Les secrets clients et le mot de passe d'administration arrivent ici, au lieu
      # d'etre recopies a la main dans un terminal.
      #
      # Un identifiant transcrit par un humain finit par etre transcrit de travers, et
      # l'echec ressemble alors a un defaut de la plateforme : Keycloak repond 401
      # « Invalid client credentials » aussi bien pour un secret errone que pour un client
      # inexistant. On cherche un probleme de realm la ou il n'y a qu'un mauvais collage.
      #
      # Ce pod peut deja joindre toutes les bases du namespace : lui confier ces valeurs
      # n'elargit pas ce qu'il permet, et il est supprime des la verification faite.
      envFrom:
        - secretRef:
            name: ocb-keycloak
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
